# Builds OptoTracker for Windows, macOS, Linux and FreeBSD and publishes it as
# a GitHub release.
#
# To make a release:
#
#   1. Set `version` in Cargo.toml and run `cargo build`, which writes the same
#      version into Cargo.lock. Commit both files.
#   2. Push a tag with that version:
#
#          git tag v0.1.0
#          git push origin v0.1.0
#
# The release appears with one file for each system attached and notes made
# from the commits since the previous tag:
#
#   OptoTracker.exe                    Windows
#   OptoTracker-macos.zip              macOS, for Apple and Intel processors
#   OptoTracker-linux-x86_64.tar.gz    Linux
#   OptoTracker-freebsd-x86_64.tar.gz  FreeBSD
#
# The workflow can also be started by hand from the Actions tab. That run tests
# and builds in the same way and keeps the files as artifacts of the run,
# without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build for Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Link the C runtime into the executable, so that it also starts on a
      # computer without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Checked in one of the builds only: the release needs all of them.
      - name: Check that the tag is the version in Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version' | tr -d '\r')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      # The application installs itself under this name, so it is released
      # under it too.
      - name: Name the executable
        run: |
          mkdir dist
          cp target/release/opto-tracker.exe dist/OptoTracker.exe

      - uses: actions/upload-artifact@v7
        with:
          name: OptoTracker-windows
          path: dist/OptoTracker.exe
          if-no-files-found: error

  macos:
    name: Build for macOS
    # A runner with an Apple processor, which also builds for Intel ones.
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # The oldest macOS that the application starts on. Info.plist, which
      # the application writes for its bundle, says the same.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      - name: Test
        run: cargo test --release --locked --target aarch64-apple-darwin

      - name: Build
        run: |
          cargo build --release --locked \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      # One executable for both processors. It writes its own bundle, the
      # same one that "Install" in its settings makes, with the icon and
      # Info.plist. Signing the bundle without an identity does not make it
      # trusted, but macOS calls a download without any signature damaged.
      - name: Make the application
        run: |
          mkdir dist
          lipo -create -output dist/OptoTracker \
            target/aarch64-apple-darwin/release/opto-tracker \
            target/x86_64-apple-darwin/release/opto-tracker
          dist/OptoTracker --bundle dist
          rm dist/OptoTracker
          codesign --force --sign - dist/OptoTracker.app
          codesign --verify --strict --verbose=2 dist/OptoTracker.app
          lipo -archs dist/OptoTracker.app/Contents/MacOS/OptoTracker

      # Nothing else runs the application on a Mac before it is released, so
      # one that does not stay up stops the release, and the page of the run
      # says what it printed. A picture of the screen is kept with the run.
      - name: Start the application once
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" dist/OptoTracker.app/Contents/MacOS/OptoTracker > start.log 2>&1 &
          application=$!
          sleep 15
          screencapture -x screen.png || true
          if kill -0 "$application" 2>/dev/null; then
            echo "OptoTracker kept running."
            kill "$application"
          else
            cat start.log
            printed="$(tail -c 1500 start.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=OptoTracker did not keep running on the macOS runner::$printed"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-screen
          path: screen.png
          if-no-files-found: ignore

      # In a zip of its own, which keeps the permission to execute that an
      # artifact would drop.
      - name: Pack the application
        run: ditto -c -k --keepParent dist/OptoTracker.app dist/OptoTracker-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: OptoTracker-macos
          path: dist/OptoTracker-macos.zip
          if-no-files-found: error

  linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    # An executable needs at least the C library that it was built with, and
    # the runner has a recent one. This image exists for building what has to
    # start on older systems too: its C library is glibc 2.28, of 2018, and
    # the compiler is already in it, so nothing has to be installed first.
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      # In an archive, which keeps the permission to execute that a plain
      # download would drop.
      - name: Pack the executable
        run: |
          mkdir dist
          tar --create --gzip --file dist/OptoTracker-linux-x86_64.tar.gz \
            --directory target/release opto-tracker

      - uses: actions/upload-artifact@v7
        with:
          name: OptoTracker-linux
          path: dist/OptoTracker-linux-x86_64.tar.gz
          if-no-files-found: error

  freebsd:
    name: Build for FreeBSD
    # GitHub has no runners with FreeBSD. The action below starts it in a
    # virtual machine on the Linux runner, copies the checkout into it, runs
    # the commands there and copies what they have made back.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Test and build in FreeBSD
        # Not an action of GitHub's own, so it is used by the commit of its
        # version 1.5.9 and not by a name that can be moved.
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          # FreeBSD runs what was built on an earlier release, and not what
          # was built on a later one. 14 is the oldest line of releases that
          # is still supported, so what is built on it serves 14 and 15.
          release: "14"
          # Everything comes from FreeBSD's own packages, as is the custom
          # there, Rust too. That Rust can be a version or two behind the one
          # of the other builds, and has to reach `rust-version` in
          # Cargo.toml. The rest is a screen that exists only in memory and
          # what a window needs, for starting the application.
          prepare: |
            pkg install -y rust xorg-vfbserver mesa-dri mesa-libs libX11 libXcursor libXi libxkbcommon

          run: |
            set -e
            # Outside the checkout, so that only the archive is copied back.
            export CARGO_TARGET_DIR="$HOME/target"

            cargo test --release --locked
            cargo build --release --locked

            # Nothing else runs the application on FreeBSD before it is
            # released, so one that does not stay up stops the release, and
            # the page of the run says what it printed.
            # Neither of the two keeps a hold on what this script is read
            # from and written to, which would keep the step from ending.
            Xvfb :7 -screen 0 1280x800x24 < /dev/null > /dev/null 2>&1 &
            screen=$!
            sleep 5
            mkdir -p "$HOME/start"
            HOME="$HOME/start" DISPLAY=:7 LIBGL_ALWAYS_SOFTWARE=1 \
              "$CARGO_TARGET_DIR/release/opto-tracker" < /dev/null > start.log 2>&1 &
            application=$!
            sleep 15
            if kill -0 "$application" 2>/dev/null; then
              echo "OptoTracker kept running."
              kill "$application" "$screen"
            else
              kill "$screen"
              cat start.log
              printed="$(tail -c 1500 start.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              echo "::error title=OptoTracker did not keep running on FreeBSD::$printed"
              exit 1
            fi

            # In an archive, which keeps the permission to execute that a
            # plain download would drop.
            mkdir dist
            tar -czf dist/OptoTracker-freebsd-x86_64.tar.gz \
              -C "$CARGO_TARGET_DIR/release" opto-tracker

      - uses: actions/upload-artifact@v7
        with:
          name: OptoTracker-freebsd
          path: dist/OptoTracker-freebsd-x86_64.tar.gz
          if-no-files-found: error

  # A separate job, so that only this one may write to the repository: nothing
  # that runs during the builds gets a token that could change a release.
  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux, freebsd]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Every file into the working directory, without a folder per artifact.
      - uses: actions/download-artifact@v8
        with:
          pattern: OptoTracker-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            OptoTracker.exe OptoTracker-macos.zip \
            OptoTracker-linux-x86_64.tar.gz OptoTracker-freebsd-x86_64.tar.gz \
            --title "OptoTracker ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
